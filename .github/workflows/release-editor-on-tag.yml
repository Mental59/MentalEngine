name: Release Editor On Tag

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release-editor:
    runs-on: ubuntu-latest

    env:
      BUILD_DIR: build
      RUNTIME_DIR: build/bin
      PACKAGE_STAGING_DIR: build/release-package

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            ninja-build \
            pkg-config \
            xorg-dev \
            libxcb1-dev \
            libxcb-xinput0 \
            libxcb-xinerama0 \
            libxcb-cursor-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Resolve Vulkan SDK version
        id: vulkan-sdk-version
        run: |
          echo "version=$(curl -fsSL https://vulkan.lunarg.com/sdk/latest/linux.txt)" >> "$GITHUB_OUTPUT"

      - name: Download Vulkan SDK
        env:
          VULKAN_SDK_VERSION: ${{ steps.vulkan-sdk-version.outputs.version }}
        run: |
          curl -fsSL \
            "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/linux/vulkan_sdk.tar.xz" \
            -o vulkan-sdk.tar.xz
          curl -fsSL \
            "https://sdk.lunarg.com/sdk/sha/${VULKAN_SDK_VERSION}/linux/vulkan_sdk.tar.xz.txt" \
            -o vulkan-sdk.tar.xz.sha256
          expected_sha256="$(cat vulkan-sdk.tar.xz.sha256 | awk '{print $1}')"
          actual_sha256="$(sha256sum vulkan-sdk.tar.xz | awk '{print $1}')"
          if [ "${actual_sha256}" != "${expected_sha256}" ]; then
            echo "Checksum mismatch for Vulkan SDK archive"
            echo "Expected: ${expected_sha256}"
            echo "Actual:   ${actual_sha256}"
            exit 1
          fi
          tar -xf vulkan-sdk.tar.xz

      - name: Export Vulkan SDK environment
        env:
          VULKAN_SDK_VERSION: ${{ steps.vulkan-sdk-version.outputs.version }}
        run: |
          echo "VULKAN_SDK=$GITHUB_WORKSPACE/${VULKAN_SDK_VERSION}/x86_64" >> "$GITHUB_ENV"

      - name: Configure release build
        run: cmake --preset release

      - name: Build MentalEditor
        run: cmake --build "${{ env.BUILD_DIR }}" --config Release --target MentalEditor

      - name: Package editor runtime
        shell: bash
        run: |
          set -euo pipefail
          tag_name="${GITHUB_REF_NAME}"
          asset_name="MentalEditor-linux-${tag_name}.tar.gz"

          rm -rf "${PACKAGE_STAGING_DIR}"
          mkdir -p "${PACKAGE_STAGING_DIR}/MentalEditor"

          cp -R "${RUNTIME_DIR}/" "${PACKAGE_STAGING_DIR}/"

          tar -C "${PACKAGE_STAGING_DIR}" -czf "${asset_name}" MentalEditor
          echo "asset_path=${GITHUB_WORKSPACE}/${asset_name}" >> "$GITHUB_OUTPUT"
        id: package

      - name: Publish GitHub release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.asset_path }}
          generate_release_notes: true
